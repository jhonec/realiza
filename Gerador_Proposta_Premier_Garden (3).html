<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Proposta – Premier Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--line:#e3e6ea;--txt:#1f2430;--mut:#6b7280;
  --pri:#2563eb;--pri-h:#1d4ed8;--ok:#16a34a;--ok-bg:#ecfdf3;--warn:#ca8a04;--warn-bg:#fefce8;--err:#dc2626;--err-bg:#fef2f2;
  --doc-blue:#1F3A93;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.app{display:grid;grid-template-columns:minmax(380px,520px) 1fr;height:100vh}
/* ---------- painel do formulário ---------- */
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card);min-height:0}
.topbar{padding:14px 16px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:16px;margin:0 0 2px;font-weight:700}
.topbar p{margin:0;color:var(--mut);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.3}
.kpi b{display:block;font-size:12px;margin-bottom:2px}
.kpi.ok{background:var(--ok-bg);border-color:#bbf7d0}.kpi.ok b{color:var(--ok)}
.kpi.warn{background:var(--warn-bg);border-color:#fde68a}.kpi.warn b{color:var(--warn)}
.kpi.err{background:var(--err-bg);border-color:#fecaca}.kpi.err b{color:var(--err)}
.actions{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:7px;padding:7px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-h)}
.btn svg{width:15px;height:15px}
.form{overflow:auto;padding:12px 16px 40px;flex:1;min-height:0}
details.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
details.sec>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary svg{width:16px;height:16px;color:var(--pri)}
details.sec>summary .chev{margin-left:auto;color:var(--mut);transition:transform .15s}
details.sec[open]>summary .chev{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:0 12px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w2{grid-column:span 2}
.f label{font-size:11px;font-weight:600;color:var(--mut)}
.f .row{display:flex;gap:4px}
.f input,.f select{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:7px 8px;font:inherit;font-size:13px;background:#fff;color:var(--txt);min-width:0}
.f input:focus,.f select:focus{outline:2px solid #bfdbfe;border-color:var(--pri)}
.f input.bad{border-color:var(--err);background:var(--err-bg)}
.calc{flex:none;border:1px solid #d1d5db;background:#f9fafb;border-radius:6px;padding:0 8px;cursor:pointer;font-weight:700;color:var(--pri)}
.calc:hover{background:#eff6ff}
.hint{font-size:10.5px;color:var(--mut)}
.subt{grid-column:span 2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--pri);margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
/* ---------- pré-visualização ---------- */
.preview{overflow:auto;padding:24px;min-height:0}
.pages{margin:0 auto;width:210mm;zoom:var(--z,1)}
.page{width:210mm;height:297mm;background:#fff;margin:0 auto 18px;box-shadow:0 2px 10px rgba(0,0,0,.12);position:relative;padding:12mm 15mm 18mm;font-family:Arial,Helvetica,sans-serif;color:var(--doc-txt,#000);font-size:9pt;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:5mm}
.ph .t1{font-size:17pt;font-weight:700;line-height:1.05}
.ph .t2{font-size:13pt;font-weight:700;color:#3F3F96}
.ph img{height:16mm}
.pf{position:absolute;left:15mm;right:15mm;bottom:8mm;font-size:8pt;font-weight:700;text-align:center}
.pf .n{text-align:right;font-weight:400;margin-bottom:2px}
.intro{font-weight:700;font-size:9.5pt;text-align:justify;margin:0 0 3mm}
table.dt{width:100%;border-collapse:collapse;margin-bottom:3.5mm;table-layout:fixed}
table.dt td{border:1px solid #000;padding:3px 5px;vertical-align:top}
.lb{font-size:6.5pt;font-weight:700;text-transform:uppercase}
.vl{font-size:10.5pt;font-weight:700;color:var(--doc-blue);min-height:15px;padding-top:2px;word-break:break-word}
.hd{background:#d9d9d9;font-weight:700;font-size:9.5pt}
.hd.c{text-align:center}
.hl{background:none}
.box{border:1px solid #000;padding:7px 9px;margin-bottom:4mm}
.pp{margin:0 0 7px;line-height:1.55;text-align:justify}
.iv{color:var(--doc-blue);font-weight:700;text-decoration:underline;font-size:10pt}
.obs{font-size:8pt;font-weight:700;text-align:justify;margin:0 0 3px}
.sm{font-size:8pt}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin:26mm 6mm 0}
.sig{text-align:center;font-size:8pt;font-weight:700}
.sig .ln{border-top:1px solid #000;padding-top:3px;position:relative}
.sigw{position:absolute;transform:translateX(-50%);cursor:grab;touch-action:none;z-index:2}
.sigw img{display:block;width:100%;height:100%;pointer-events:none;user-select:none}
.sigw .rh{display:none;position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;background:var(--pri);border:2px solid #fff;border-radius:50%;cursor:nwse-resize;box-shadow:0 0 0 1px var(--pri)}
@media screen{.sigw:hover{outline:1px dashed #93c5fd}.sigw.sel{outline:1.5px solid var(--pri)}.sigw.sel .rh,.sigw:hover .rh{display:block}}
.sigw.drag{cursor:grabbing}
.sigbar{position:sticky;top:0;z-index:5;margin:0 auto 12px;width:max-content;max-width:100%;display:none;align-items:center;gap:4px;background:#111827;color:#fff;border-radius:10px;padding:6px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.sigbar.on{display:flex;flex-wrap:wrap}
.sigbar b{margin:0 6px 0 2px;font-weight:600}
.sigbar button{border:0;background:#374151;color:#fff;border-radius:6px;min-width:30px;height:28px;padding:0 8px;cursor:pointer;font:inherit;font-weight:700}
.sigbar button:hover{background:#4b5563}
.sigbar .sep{width:1px;height:20px;background:#4b5563;margin:0 3px}
.sigslot{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.sigslot h4{margin:0 0 8px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.sigprev{height:78px;border:1px dashed #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11.5px;margin-bottom:8px;
  background-color:#fff;background-image:linear-gradient(45deg,#eef0f3 25%,transparent 25%),linear-gradient(-45deg,#eef0f3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eef0f3 75%),linear-gradient(-45deg,transparent 75%,#eef0f3 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0}
.sigprev img{max-height:70px;max-width:95%}
.sigbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sigbtns .btn{padding:5px 9px;font-size:12px}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.sliders label{font-size:11px;color:var(--mut);font-weight:600;display:flex;flex-direction:column;gap:2px}
.sliders input[type=range]{width:100%}
.sliders select{border:1px solid #d1d5db;border-radius:6px;padding:4px;font:inherit;font-size:12px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer}
.sw:hover{box-shadow:0 0 0 2px var(--pri)}
.colrow{display:flex;align-items:center;gap:8px}
.colrow input[type=color]{width:42px;height:32px;border:1px solid #d1d5db;border-radius:6px;padding:2px;background:#fff;cursor:pointer}
.note{font-size:11px;color:var(--mut);margin:0 12px 10px;line-height:1.4}
@media (max-width:980px){.app{grid-template-columns:1fr;height:auto}.side{border-right:0}.form{overflow:visible}.preview{overflow:visible}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .side,.toast{display:none!important}
  .app{display:block;height:auto}
  .preview{padding:0;overflow:visible}
  .pages{zoom:1!important;width:auto}
  .page{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  .hl,.hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="topbar">
      <h1>Proposta de Compra — Premier Garden</h1>
      <p>Preencha à esquerda; o documento à direita atualiza em tempo real. Assinaturas ficam em branco.</p>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="actions">
      <button class="btn pri" id="bDocx"><i data-lucide="file-down"></i>Gerar Word (.docx)</button>
      <button class="btn" id="bPrint"><i data-lucide="printer"></i>Imprimir / PDF</button>
      <button class="btn" id="bNew"><i data-lucide="file-plus"></i>Nova proposta</button>
      <button class="btn" id="bExp"><i data-lucide="download"></i>Exportar dados</button>
      <button class="btn" id="bImp"><i data-lucide="upload"></i>Importar dados</button>
      <input type="file" id="fImp" accept=".json,application/json" hidden>
    </div>
    <div class="form" id="form"></div>
  </aside>
  <main class="preview" id="preview">
  <div class="sigbar" id="sigbar"><b id="sbName">Assinatura</b>
    <button data-mv="-1,0" title="Esquerda">←</button><button data-mv="1,0" title="Direita">→</button><button data-mv="0,1" title="Subir">↑</button><button data-mv="0,-1" title="Descer">↓</button>
    <span class="sep"></span><button data-zm="-5" title="Diminuir">−</button><span id="sbPct" style="min-width:40px;text-align:center">100%</span><button data-zm="5" title="Aumentar">+</button>
    <span class="sep"></span><button data-rs="1" title="Centralizar e tamanho padrão">Centralizar</button><button data-cl="1" title="Fechar">✕</button></div>
  <div class="pages" id="pages"></div></main>
</div>
<div class="toast" id="toast"></div>

</script>

const S=v=>(v==null?'':String(v)).trim();
const parseBR=v=>{v=S(v);if(!v)return NaN;v=v.replace(/[^\d,.-]/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v);};
const fmtBR=n=>isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
const dig=v=>S(v).replace(/\D/g,'');
function cpfOk(v){const d=dig(v);if(d.length!==11||/^(\d)\1+$/.test(d))return false;for(const n of[9,10]){let s=0;for(let i=0;i<n;i++)s+=+d[i]*(n+1-i);if((s*10)%11%10!==+d[n])return false;}return true;}
function cnpjOk(v){const d=dig(v);if(d.length!==14||/^(\d)\1+$/.test(d))return false;const W=[6,5,4,3,2,9,8,7,6,5,4,3,2];for(const n of[12,13]){let s=0;for(let i=0;i<n;i++)s+=+d[i]*W[i+13-n];let r=s%11;r=r<2?0:11-r;if(r!==+d[n])return false;}return true;}

const PLACES={c1:'sig_c1',c2:'sig_c2',rea:'sig_rea',cor4:'sig_cor',cor3:'sig_cor'};
const PLACE_MAXW={c1:330,c2:330,rea:330,cor4:330,cor3:420};
/* geometria em px (96 dpi). Altura base 16 mm × escala; dx/dy em mm (dy positivo = para cima) */
function sigGeom(D,place){
  const slot=PLACES[place],u=S(D[slot]);if(!u.startsWith('data:image/png'))return null;

const loadImg=src=>new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>err(new Error('Imagem inválida'));i.src=src;});
async function normalizeSrc(file){ // reduz a foto original (máx. 1600 px) para guardar e reprocessar
  const url=URL.createObjectURL(file);try{const im=await loadImg(url);const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.9);}finally{URL.revokeObjectURL(url);}
}
async function processSig(src,sens,ink,rot){

  const w=sw,h=sh,id=x.getImageData(0,0,w,h),d=id.data,N=w*h,L=new Float32Array(N);
  for(let i=0,j=0;i<N;i++,j+=4)L[i]=.299*d[j]+.587*d[j+1]+.114*d[j+2];

  const B=Math.max(12,Math.round(Math.max(w,h)/45)),bw=Math.ceil(w/B),bh=Math.ceil(h/B),bg=new Float32Array(bw*bh),hist=new Uint32Array(256);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){hist.fill(0);let n=0;
    for(let y=by*B;y<Math.min(h,(by+1)*B);y++)for(let xx=bx*B;xx<Math.min(w,(bx+1)*B);xx++){hist[L[y*w+xx]|0]++;n++;}
    let acc=0,t=n*0.9,v=255;for(let q=0;q<256;q++){acc+=hist[q];if(acc>=t){v=q;break;}}bg[by*bw+bx]=v;}
  const bg2=new Float32Array(bw*bh);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){let s=0,n=0,m=0;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const yy=by+oy,xx=bx+ox;if(yy<0||xx<0||yy>=bh||xx>=bw)continue;const v=bg[yy*bw+xx];s+=v;n++;if(v>m)m=v;}bg2[by*bw+bx]=Math.max(s/n,m-25);}
  const lo=Math.max(6,62-(+sens)*0.52),span=40;
  const A=new Uint8ClampedArray(N);let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++){const fy=Math.min(bh-1,Math.max(0,y/B-.5)),iy=Math.floor(fy),ty=fy-iy,iy2=Math.min(bh-1,iy+1);
    for(let xx=0;xx<w;xx++){const fx=Math.min(bw-1,Math.max(0,xx/B-.5)),ix=Math.floor(fx),tx=fx-ix,ix2=Math.min(bw-1,ix+1);
      const b=(bg2[iy*bw+ix]*(1-tx)+bg2[iy*bw+ix2]*tx)*(1-ty)+(bg2[iy2*bw+ix]*(1-tx)+bg2[iy2*bw+ix2]*tx)*ty;
      const i=y*w+xx,a=Math.min(1,Math.max(0,(b-L[i]-lo)/span));A[i]=a*255;
      if(a>.35){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y;}}}
  if(x1<0)throw new Error('Nenhum traço encontrado. Aumente a "Limpeza do fundo" ou use uma foto mais nítida.');

  const A2=new Uint8ClampedArray(A);

  const pad=Math.round(Math.max(x1-x0,y1-y0)*0.04)+4;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const cw=x1-x0+1,ch=y1-y0+1,k=Math.min(1,900/cw,320/ch),ow=Math.max(1,Math.round(cw*k)),oh=Math.max(1,Math.round(ch*k));
  const t=document.createElement('canvas');t.width=cw;t.height=ch;const tx=t.getContext('2d'),od=tx.createImageData(cw,ch),o=od.data;
  const INK={blue:[24,48,160],black:[18,18,22]}[ink];
  for(let y=0;y<ch;y++)for(let xx=0;xx<cw;xx++){const i=(y+y0)*w+xx+x0,j=(y*cw+xx)*4;const a=A2[i];if(!a)continue;

}

function bindSigDrag(){
  const pages=document.getElementById('pages');const zoom=()=>parseFloat(getComputedStyle(pages).getPropertyValue('--z'))||1;
  let st=null;
  pages.addEventListener('pointerdown',e=>{const w=e.target.closest('.sigw');if(!w){if(selPlace)selectPlace(null);return;}
    e.preventDefault();const p=w.dataset.pl;selectPlace(p);w.setPointerCapture(e.pointerId);

  pages.addEventListener('pointermove',e=>{if(!st)return;const k=1/zoom()/3.7795,mx=(e.clientX-st.x)*k,my=(e.clientY-st.y)*k,p=st.p;
    if(st.res){D['pl_'+p+'_sc']=clamp(st.sc*(st.w+2*mx)/st.w,25,260);}
    else{D['pl_'+p+'_dx']=+clamp(st.dx+mx,-60,60).toFixed(2);D['pl_'+p+'_dy']=+clamp(st.dy-my,-12,25).toFixed(2);}

    const step=e.shiftKey?2:0.5,m={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,step],ArrowDown:[0,-step]}[e.key];

  <p class="pp">- <b>PARCELAS INTERMEDIÁRIAS</b> (se houver) R$ ${iv(D.int_v)} mediante ${iv(D.int_q,4)}${per('int_per')}${iv(D.int_p)} cada uma, vencendo a primeira em ${iv(D.int_d,0)||DATE_BLANK} e as demais nos mesmos dias, sujeitas a reajustamento monetário, acréscimos e juros;</p>
  <p class="pp">- <b>PARCELAS PRÊMIO</b> (se houver) R$ ${iv(D.pre_v)} mediante ${iv(D.pre_q,4)}${per('pre_per')}${iv(D.pre_p)} cada uma, vencendo a primeira em ${iv(D.pre_d,0)||DATE_BLANK} e as demais nos mesmos dias, sujeitas a reajustamento monetário, acréscimos e juros;</p>
  <p class="pp">- <b>FINANCIAMENTO BANCÁRIO, SUBSÍDIO E FGTS</b> (se houver):</p>
  <p class="pp">R$ ${iv(D.banc)} pagos mediante a contratação de financiamento bancário junto ao <b><u>Agente Financeiro quando a Promitente Vendedora informar.</u></b></p>
  <p class="obs"><u>OBSERVAÇÕES QUANTO AO PREÇO</u></p><p class="obs">${TXT.obs1}</p><p class="obs">${TXT.obs2}</p><p class="obs">${TXT.obs3}</p></div>`;
  const hd=(x,hl)=>`<tr><td colspan="2" class="hd c">${hl?`<span class="hl">${x}</span>`:x}</td></tr>`;
  const p3=`<table class="dt"><colgroup><col style="width:64.7%"><col></colgroup>${hd('INTERMEDIAÇÃO DE CORRETAGEM',1)}${hd('VALOR DA COMISSÃO')}
  <tr><td colspan="2"><b>R$</b> ${iv(D.com_v)}</td></tr>${hd('DESTINAÇÃO DO PAGAMENTO')}
  <tr>${cell('Corretor que intermediou a venda',D.cor_nome)}${cell('CRECI',D.cor_creci)}</tr>
  <tr>${cell('Imobiliária',D.imob)}${cell('CNPJ',D.imob_cnpj)}</tr>${hd('FORMA DE PAGAMENTO')}
  <tr><td colspan="2" style="padding:7px 9px">
   <p class="pp">• <b><u>PARTE I</u> – COMISSÃO APARTADA</b></p>
   <p class="pp">R$ ${iv(D.p1_v)} pagamento de responsabilidade do CLIENTE diretamente à imobiliária e/ou ao corretor;</p>
   <p class="pp" style="margin:0">• <b><u>PARTE II</u> – PAGAMENTO FACILITADO</b></p><p class="pp sm">${TXT.aplic}</p>
   <p class="pp">R$ ${iv(D.p2_v)} pagamento de responsabilidade do CLIENTE, que será pago pela REALIZA, em nome e por conta do cliente e por este restituído.</p>
   <p class="pp"><b style="font-size:11pt">Forma de restituição da PARTE II</b> <span class="sm">${TXT.aplic.slice(0,-1)}):</span></p>
   <p class="pp">R$ ${iv(D.r2_v)} a serem pagos mediante ${iv(D.r2_q,4)} prestações mensais e consecutivas no valor de R$ ${iv(D.r2_p)} cada uma, vencendo a primeira em ${iv(D.r2_d,0)||DATE_BLANK} e as demais nos mesmos dias dos meses subsequentes, sujeitas a juros e reajustamento.</p></td></tr>
  <tr><td colspan="2" style="height:24mm;position:relative"><div class="lb" style="font-size:8pt">Assinatura do corretor responsável pela venda:</div><div style="position:absolute;bottom:4px;left:9px;width:94mm;border-top:1px solid #000;font-size:8pt;padding-top:2px">${sigImg('cor3')}Corretor(a) responsável pela venda</div></td></tr></table>
  <table class="dt" style="margin-top:7mm"><tr><td class="hd c"><span class="hl">DESPESAS ACESSÓRIAS</span><div style="font-size:7.5pt;font-weight:400">${TXT.aplic}</div></td></tr>
  <tr>${cell('Quem paga:','INTERESSADO ADQUIRENTE')}</tr><tr><td class="hd c">VALOR TOTAL DAS DESPESAS ACESSÓRIAS</td></tr>
  <tr><td style="padding:6px"><b>R$</b> ${iv(D.desp_v)}<div class="lb" style="font-size:8pt;margin-top:8px">Forma de restituição:</div></td></tr></table>`;
  const p4=`<div class="box" style="padding:10px"><p class="pp" style="margin:0">R$ ${iv(D.desp_v)} a serem pagos mediante ${iv(D.desp_q,4)} prestações mensais e consecutivas no valor de R$ ${iv(D.desp_p)} cada uma, vencendo a primeira em ${iv(D.desp_d,0)||DATE_BLANK} e as demais nos mesmos dias dos meses subsequentes, sujeitas a juros e reajustamento.</p></div>
  <table class="dt" style="margin-top:6mm"><tr><td class="hd c">AUTORIZAÇÃO PARA FORNECIMENTO DE DADOS CADASTRAIS E TRATAMENTO DE DADOS</td></tr>
  <tr><td style="padding:7px 9px;font-size:8pt;text-align:justify"><p style="margin:0 0 5px">${richH(TXT.aut1)}</p><p style="margin:0 0 5px">${richH(TXT.aut2)}</p><p style="margin:0 0 8px">${richH(TXT.aut3)}</p><p style="margin:0;text-align:center"><b><u>${TXT.autF}</u></b></p></td></tr></table>
  <p style="text-align:center;font-weight:700;font-size:10pt;margin-top:14mm">Rio Verde - GO, ${iv(D.dia,6)} de ${iv(D.mes,16)} de ${iv(D.ano,8)}.</p>
  <div class="sigs"><div class="sig"><div class="ln">${sigImg('c1')}COMPRADOR</div></div><div class="sig"><div class="ln">${sigImg('c2')}COMPRADOR 2 e/ou CÔNJUGE</div></div></div>
  <div class="sigs" style="margin-top:30mm"><div class="sig"><div class="ln">${sigImg('rea')}REALIZA - GERENTE COMERCIAL</div></div><div class="sig"><div class="ln">${sigImg('cor4')}CORRETOR RESPONSÁVEL (Nome legível)</div></div></div>
  <p style="font-weight:700;font-size:10pt;margin-top:14mm">Telefone de contato do corretor: ${iv(D.cor_tel,30)}</p>
  <p style="font-weight:700;font-size:10pt">E-mail do corretor: ${iv(D.cor_email,42)}</p>`;
  const pg=document.getElementById('pages');pg.style.setProperty('--doc-blue',D.cor_val||'#1F3A93');pg.style.setProperty('--doc-txt',D.cor_txt||'#000000');
  if(selPlace&&!sigGeom(D,selPlace))selPlace=null;
  pg.innerHTML=pageWrap(1,p1)+pageWrap(2,p2)+pageWrap(3,p3)+pageWrap(4,p4);
}
/* ======================= VALIDAÇÕES / KPIs ======================= */
function n(k){const x=parseBR(D[k]);return isFinite(x)?x:0;}
function kpis(){
  const out=[];
  const preco=n('preco'),soma=['sinal_v','fin_v','int_v','pre_v','banc'].reduce((a,k)=>a+n(k),0);
  if(!preco)out.push(['warn','Preço','Informe o preço do imóvel']);
  else{const d=Math.round((preco-soma)*100)/100;out.push(Math.abs(d)<0.01?['ok','Pagamento','Soma = preço ✓']:['err','Pagamento',`Diferença R$ ${fmtBR(d)}`]);}
  const com=n('com_v'),cs=n('p1_v')+n('p2_v');
  if(!com)out.push(['warn','Comissão','Não informada']);
  else out.push(Math.abs(com-cs)<0.01?['ok','Comissão','Parte I + II ✓']:['err','Comissão',`Partes somam R$ ${fmtBR(cs)}`]);
  // parcelas: q*p ~ v (tolerância de R$0,01 por prestação)
  const bad=[];for(const[p,l]of[['sinal','Sinal'],['fin','Finan'],['int','Interm.'],['pre','Prêmio'],['r2','Rest. P.II'],['desp','Despesas']]){const v=n(p+'_v'),q=n(p+'_q'),pp=n(p+'_p');if(v&&q&&pp&&Math.abs(q*pp-v)>q*0.01+0.01)bad.push(l);}
  if(n('r2_v')&&n('p2_v')&&Math.abs(n('r2_v')-n('p2_v'))>0.009)bad.push('Rest.≠Parte II');
  out.push(bad.length?['err','Parcelas',bad.join(', ')]:['ok','Parcelas','Valores coerentes ✓']);
  const docs=[];if(S(D.c1_cpf)&&!cpfOk(D.c1_cpf))docs.push('CPF comprador');if(S(D.c2_cpf)&&!cpfOk(D.c2_cpf))docs.push('CPF comprador 2');if(S(D.imob_cnpj)&&!cnpjOk(D.imob_cnpj))docs.push('CNPJ imob.');
  out.push(docs.length?['err','Documentos',docs.join(', ')+' inválido']:['ok','Documentos','CPF/CNPJ válidos ✓']);
  const req={c1_nome:'Nome',c1_cpf:'CPF',c1_tel:'Telefone',apto:'Apto',torre:'Torre',pne:'PNE',dia:'Dia',mes:'Mês',ano:'Ano',cor_nome:'Corretor'};
  const miss=Object.entries(req).filter(([k])=>!S(D[k])).map(([,l])=>l);
  out.push(miss.length?['warn','Pendências',miss.slice(0,4).join(', ')+(miss.length>4?` +${miss.length-4}`:'')]:['ok','Pendências','Essenciais preenchidos ✓']);
  const c2=['c2_nome','c2_cpf','c2_nasc'].some(k=>S(D[k]));const ec=S(D.c1_ec).toLowerCase();
  out.push(ec.startsWith('casad')&&!S(D.regime)?['warn','Casamento','Informe o regime']:c2&&!S(D.c2_nome)?['warn','Comprador 2','Nome em branco']:['ok','Comprador 2','Coerente ✓']);
  document.getElementById('kpis').innerHTML=out.map(([c,b,tx])=>`<div class="kpi ${c}"><b>${b}</b>${esc(tx)}</div>`).join('');
}
function validateFields(){
  document.querySelectorAll('#form input').forEach(el=>{
    const t=el.dataset.t,v=S(el.value);let bad=false;
    if(v){if(t==='cpf')bad=!cpfOk(v);else if(t==='cnpj')bad=!cnpjOk(v);else if(t==='email')bad=!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      else if(t==='date'){const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);bad=!m||+m[1]<1||+m[1]>31||+m[2]<1||+m[2]>12;}
      else if(t==='money')bad=!isFinite(parseBR(v));}
    el.classList.toggle('bad',bad);
  });
}
/* ======================= ESTADO ======================= */
let quotaWarn=false;function save(){try{localStorage.setItem(STORE,JSON.stringify(D));}catch(e){if(!quotaWarn){quotaWarn=true;toast('Rascunho grande demais para salvar no navegador — use Exportar dados.');}}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&typeof x==='object')return x;}catch(e){}return null;}
let rT;function refresh(){clearTimeout(rT);rT=setTimeout(()=>{renderPreview();kpis();save();},80);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}
/* ======================= EVENTOS ======================= */
function bind(){
  const form=document.getElementById('form');
  form.addEventListener('input',e=>{const el=e.target;if(!el.id)return;const t=el.dataset.t;
    if(t&&MASK[t]){const before=el.value,m=MASK[t](before);if(m!==before){el.value=m;}}
    D[el.id]=el.value;el.classList.remove('bad');refresh();});
  form.addEventListener('change',e=>{const el=e.target;if(!el.id)return;D[el.id]=el.value;refresh();});
  form.addEventListener('focusout',e=>{const el=e.target;if(el.dataset&&el.dataset.t==='money'&&S(el.value)){const x=parseBR(el.value);if(isFinite(x)){el.value=fmtBR(x);D[el.id]=el.value;refresh();}}validateFields();});
  form.addEventListener('click',e=>{const b=e.target.closest('[data-calc]');if(!b)return;const[dst,vk,qk]=b.dataset.calc.split('|');const v=n(vk),q=n(qk);
    if(!v||!q){toast('Informe o valor total e o nº de prestações');return;}D[dst]=fmtBR(Math.round(v/q*100)/100);document.getElementById(dst).value=D[dst];refresh();toast('Prestação calculada: R$ '+D[dst]);});
  // assinaturas
  form.addEventListener('click',e=>{const b=e.target.closest('[data-sa]');if(!b||b.dataset.sa==='file')return;const k=b.closest('.sigslot').dataset.slot;
    if(b.dataset.sa==='up')b.closest('.sigslot').querySelector('[data-sa=file]').click();
    else if(b.dataset.sa==='rot'){if(!S(D[k+'_src']))return toast('Envie a foto primeiro');D[k+'_rot']=(+sp(k,'rot')+90)%360;rebuildSig(k);}
    else if(b.dataset.sa==='ctr'){resetPlaces(k);refresh();toast('Posição e tamanho restaurados');}
    else if(b.dataset.sa==='del'){resetPlaces(k);for(const p of['','_src','_ar','_rot'])delete D[k+p];syncSigUI(k);refresh();}});
  form.addEventListener('change',async e=>{const el=e.target;if(el.dataset.sa!=='file'||!el.files[0])return;const k=el.closest('.sigslot').dataset.slot;
    try{toast('Processando assinatura…');D[k+'_src']=await normalizeSrc(el.files[0]);D[k+'_rot']=0;await rebuildSig(k);if(S(D[k]))toast('Assinatura inserida');}
    catch(err){toast(err.message||'Não foi possível ler a imagem');}el.value='';});
  let sT;form.addEventListener('input',e=>{const el=e.target;if(!el.dataset.sp)return;const k=el.closest('.sigslot').dataset.slot,p=el.dataset.sp;D[k+'_'+p]=el.value;
    if(p==='sens'||p==='ink'){clearTimeout(sT);sT=setTimeout(()=>rebuildSig(k),180);}else refresh();});
  form.addEventListener('click',e=>{const s=e.target.closest('[data-sw]');if(!s)return;const[id,c]=s.dataset.sw.split('|');D[id]=c;document.getElementById(id).value=c;refresh();});
  form.addEventListener('click',e=>{if(!e.target.closest('#bCorReset'))return;D.cor_val='#1F3A93';D.cor_txt='#000000';fillForm();refresh();});
  bindSigDrag();
  document.getElementById('bPrint').onclick=()=>{renderPreview();window.print();};
  document.getElementById('bNew').onclick=()=>{if(!confirm('Limpar os dados do cliente e iniciar nova proposta? (dados do corretor são mantidos)'))return;const k={};KEEP.forEach(x=>k[x]=D[x]);Object.keys(D).filter(x=>KEEP_PREFIX.some(p=>x.startsWith(p))).forEach(x=>k[x]=D[x]);D={...k,pne:'N'};fillForm();refresh();toast('Nova proposta iniciada');};
  document.getElementById('bExp').onclick=()=>{const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});dl(b,fname('json'));};
  document.getElementById('bImp').onclick=()=>document.getElementById('fImp').click();
  document.getElementById('fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(tx=>{try{const x=JSON.parse(tx);if(!x||typeof x!=='object')throw 0;D=x;fillForm();refresh();toast('Dados importados');}catch(_){toast('Arquivo inválido');}e.target.value='';});};
  document.getElementById('bDocx').onclick=async()=>{
    if(!window.docx){toast('Biblioteca do Word não carregou (verifique a internet). Use Imprimir / PDF.');return;}
    try{const doc=buildDoc(D,window.docx);const blob=await window.docx.Packer.toBlob(doc);dl(blob,fname('docx'));toast('Documento Word gerado');}
    catch(err){console.error(err);toast('Erro ao gerar: '+err.message);}
  };
  const fit=()=>{const pv=document.getElementById('preview');const w=pv.clientWidth-48;const z=Math.min(1,w/(210*3.7795));document.getElementById('pages').style.setProperty('--z',z>0.3?z:0.3);};
  window.addEventListener('resize',fit);fit();
}
function fname(ext){const nm=S(D.c1_nome).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'cliente';const u=[S(D.torre),S(D.apto)].filter(Boolean).join('-');return `Proposta_Premier_Garden_${nm}${u?'_'+u:''}.${ext}`;}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
/* ======================= INIT ======================= */
renderForm();D=load()||{...DEFAULT};fillForm();renderPreview();kpis();bind();
if(window.lucide)lucide.createIcons();
</script>
